name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Create deployment archive
        run: |
          rm -rf .next/cache
          tar -czf nexarrow-release.tgz \
            .next \
            public \
            next.config.mjs \
            package.json \
            package-lock.json

      - name: Upload release to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: nexarrow-release.tgz
          target: /home/ubuntu/nexarrow-deploy

      - name: Activate release on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            APP_DIR=/var/www/nexarrow
            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER":"$USER" "$APP_DIR" /home/ubuntu/nexarrow-deploy
            tar -xzf /home/ubuntu/nexarrow-deploy/nexarrow-release.tgz -C "$APP_DIR"
            cd "$APP_DIR"
            npm ci --omit=dev
            pm2 start npm --name nexarrow -- start || pm2 restart nexarrow
            pm2 save
